apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving-deployment
  namespace: ml-training
  labels:
    app: ml-serving
    project: mlops-pytorch-pipeline
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      containers:
        - name: serving-container
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: MODEL_PATH
              value: "/app/checkpoints/classifier_v1.pt"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true
      volumes:
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: training-checkpoints-pvc
            readOnly: true
